# Automated half of the release security gate: secret scanning and dependency
# audit. The parts that need judgement stay a manual pre-release step.

name: Security gate

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday morning: new advisories land against dependencies that have not
    # changed since the last commit. Without this the finding waits for the
    # next push, which may be weeks away.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # gitleaks needs the whole history

      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the full history
        # Called directly rather than through the action: the action limits push
        # and PR runs to the event's commit range, so a secret sitting in an older
        # commit would never surface.
        run: gitleaks git . --config .gitleaks.toml --redact --exit-code 1

      - name: Scan the working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --exit-code 1

      - name: No environment file in the repository
        # Deterministic where gitleaks is heuristic: a pattern may miss a value,
        # this step never misses a committed .env.
        run: |
          hits=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.(example|sample|template|dist)$' || true)
          if [ -n "$hits" ]; then
            echo "::error::Environment files committed: $hits"
            exit 1
          fi

      - name: No key or certificate material in the repository
        run: |
          hits=$(git ls-files | grep -iE '\.(pem|key|pfx|p12|crt|jks|keystore)$' || true)
          if [ -n "$hits" ]; then
            echo "::error::Key material committed: $hits"
            exit 1
          fi

  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: npm audit
        # high and critical break the build; moderate and low are Dependabot's
        # weekly business, not a reason to block a pull request.
        run: npm audit --audit-level=high

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        # --pull and --no-cache: the scan must see what a release build ships
        # today, including Debian fixes that landed after the last build.
        run: docker build --pull --no-cache -t oss-scan:${{ github.sha }} .

      - name: Install Trivy
        # Binary with a pinned checksum instead of the action: the action's
        # tags were hijacked once, a checksum cannot be moved.
        run: |
          VERSION=0.75.0
          SHA256=c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
          curl -sSLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz"
          echo "${SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz -C /usr/local/bin trivy
          trivy --version

      - name: Scan for fixable high and critical findings
        # Unfixed findings cannot be acted on and would only train everyone to
        # ignore a red job. Exceptions live in .trivyignore.yaml with an expiry.
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore.yaml --exit-code 1 oss-scan:${{ github.sha }}
